name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Porfolio_Rosario_Ruiz/package-lock.json

      - name: Install dependencies
        working-directory: Porfolio_Rosario_Ruiz
        run: npm install

      - name: Lint
        working-directory: Porfolio_Rosario_Ruiz
        run: npm run lint

      - name: Build
        working-directory: Porfolio_Rosario_Ruiz
        run: npm run build
