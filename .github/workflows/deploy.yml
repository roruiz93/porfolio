name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Porfolio_Rosario_Ruiz/package-lock.json

      - name: Install dependencies
        working-directory: Porfolio_Rosario_Ruiz
        run: npm install

      - name: Build
        working-directory: Porfolio_Rosario_Ruiz
        run: npm run build

      - name: Deploy to Firebase Hosting
        working-directory: Porfolio_Rosario_Ruiz
        run: npx firebase-tools deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive
